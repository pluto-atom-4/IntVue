name: Config Validation

on:
  push:
    branches: [main, feat/**]
    paths:
      - '.claude/settings.json'
      - '.claude/settings.local.json'
      - '.github/copilot-instructions.md'
      - '.claude/skills/*/SKILL.md'
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - '.claude/rules/**'
  pull_request:
    branches: [main]

jobs:
  validate-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate .claude/settings.json (JSON schema)
        run: |
          echo "Validating .claude/settings.json..."
          python3 -m json.tool .claude/settings.json > /dev/null
          echo "✓ JSON valid"

      - name: Validate .claude/settings.local.json
        run: |
          if [ -f .claude/settings.local.json ]; then
            echo "Validating .claude/settings.local.json..."
            python3 -m json.tool .claude/settings.local.json > /dev/null
            echo "✓ JSON valid"
          fi

      - name: Validate PreToolUse hooks (regex patterns)
        run: |
          echo "Checking PreToolUse hook patterns..."
          if grep -q '"PreToolUse"' .claude/settings.json; then echo "✓ PreToolUse section found"; else echo "✗ PreToolUse section MISSING"; exit 1; fi
          if grep -q 'rm -rf' .claude/settings.json; then echo "✓ rm -rf guard present"; else echo "✗ rm -rf guard MISSING"; exit 1; fi
          if grep -q 'git push --force' .claude/settings.json; then echo "✓ git push --force guard present"; else echo "  (no git push --force guard — tracked separately, not yet enforced)"; fi
          if grep -q 'git reset --hard' .claude/settings.json; then echo "✓ git reset --hard guard present"; else echo "✗ git reset --hard guard MISSING"; exit 1; fi

      - name: Validate YAML frontmatter in .github/copilot-instructions.md
        run: |
          echo "Checking YAML frontmatter..."
          if head -1 .github/copilot-instructions.md | grep -q "^---"; then echo "✓ YAML start found"; else echo "  (no YAML frontmatter — not used in this repo)"; fi
          if grep -q "^---$" .github/copilot-instructions.md; then echo "✓ YAML end found"; fi
          if grep -q "applyTo:" .github/copilot-instructions.md; then echo "✓ applyTo field present"; else echo "  (no applyTo field — not used in this repo)"; fi

      - name: Validate skill SKILL.md metadata
        run: |
          echo "Validating skill metadata..."
          for skill_file in .claude/skills/*/SKILL.md; do
            echo "Checking $skill_file..."
            if grep -q "^name:" "$skill_file"; then echo "  ✓ name field"; else echo "  ✗ name field MISSING"; exit 1; fi
            if grep -q "^description:" "$skill_file"; then echo "  ✓ description field"; else echo "  ✗ description field MISSING"; exit 1; fi
            if grep -q "^dependencies:" "$skill_file"; then echo "  ✓ dependencies field"; else echo "  (no dependencies field — optional)"; fi
            if grep -q "^phases:" "$skill_file"; then echo "  ✓ phases field"; else echo "  (no phases field — optional)"; fi
            if grep -q "^cost_estimate:" "$skill_file"; then echo "  ✓ cost_estimate field"; else echo "  (no cost_estimate field — optional)"; fi
          done

      - name: Validate CLAUDE.md line count
        run: |
          lines=$(wc -l < CLAUDE.md)
          echo "CLAUDE.md: $lines lines"
          if [ "$lines" -gt 250 ]; then
            echo "❌ CLAUDE.md exceeds 250 lines ($lines)"
            exit 1
          fi
          echo "✓ Under 250 lines"

      - name: Validate AGENTS.md Two-Gate System
        run: |
          echo "Checking AGENTS.md for Two-Gate System..."
          if grep -q "Two-Gate System" AGENTS.md; then echo "✓ Two-Gate System section found"; else echo "✗ Two-Gate System section MISSING"; exit 1; fi
          if grep -q "Gate 1:" AGENTS.md; then echo "✓ Gate 1 documented"; else echo "✗ Gate 1 MISSING"; exit 1; fi
          if grep -q "Gate 2:" AGENTS.md; then echo "✓ Gate 2 documented"; else echo "✗ Gate 2 MISSING"; exit 1; fi

      - name: Validate Skill Discovery section
        run: |
          echo "Checking AGENTS.md for Skill Discovery..."
          if grep -q "Skill Discovery" AGENTS.md; then echo "✓ Skill Discovery section found"; else echo "✗ Skill Discovery section MISSING"; exit 1; fi
          if grep -q "SKILL\.md" AGENTS.md; then echo "✓ SKILL.md metadata format documented"; else echo "  (SKILL.md not referenced by name in AGENTS.md — optional)"; fi

      - name: Test PostToolUse hook (smoke test)
        run: |
          echo "Testing hook invocation..."
          if [ -f .claude/hooks/post-edit-quality.sh ]; then
            bash -n .claude/hooks/post-edit-quality.sh && echo "✓ Hook script is valid bash"
          fi

      - name: Validate cross-tool config sync
        run: |
          echo "Checking config consistency across tools..."
          # Verify settings.json and copilot-instructions.md tool constraints align
          if grep -q "rm -rf" .claude/settings.json && grep -q "rm -rf" .github/copilot-instructions.md; then
            echo "✓ Tool constraints sync (rm -rf)"
          else
            echo "  (rm -rf guard not duplicated in copilot-instructions.md — optional)"
          fi
          if grep -q "git push --force" .claude/settings.json && grep -q "git push --force" .github/copilot-instructions.md; then
            echo "✓ Tool constraints sync (git push --force)"
          else
            echo "  (git push --force guard not duplicated in copilot-instructions.md — optional)"
          fi

  lint-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check markdown formatting
        run: |
          echo "Validating markdown syntax..."
          for md_file in CLAUDE.md AGENTS.md .github/copilot-instructions.md; do
            echo "Checking $md_file..."
            grep -E '^\[' "$md_file" | head -5 || echo "  ✓ Links ok"
          done

      - name: Check for broken references
        run: |
          echo "Checking cross-document references..."
          # Check CLAUDE.md references exist
          if grep -q '@AGENTS.md' CLAUDE.md; then
            if [ -f AGENTS.md ]; then
              echo "✓ @AGENTS.md reference OK"
            fi
          fi
          # Check copilot-instructions.md references
          grep '\[' .github/copilot-instructions.md | grep -o '\(.*\)' | head -5 || echo "✓ References ok"
